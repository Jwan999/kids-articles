<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Three overlapping curved paths representing "مسارات" (paths/tracks) -->
  <!-- Yellow path - curves from bottom-left upward -->
  <path
    d="M8 38 C8 28, 14 18, 24 14 C34 10, 40 16, 40 22"
    fill="none"
    stroke="#FBDC41"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Pink path - curves from left to right through center -->
  <path
    d="M6 26 C12 20, 20 16, 28 18 C36 20, 42 28, 42 36"
    fill="none"
    stroke="#ED70AA"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Blue path - curves from top-left downward -->
  <path
    d="M10 10 C16 14, 20 22, 22 30 C24 38, 32 40, 40 38"
    fill="none"
    stroke="#52C8EC"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- Small circle node at intersection area -->
  <circle cx="24" cy="22" r="3.5" fill="#2B2F4A" />
</svg>
